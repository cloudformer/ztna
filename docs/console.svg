<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640"
     font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <style>
      .win    { fill: #353735; stroke: #4f534f; stroke-width: 1.4; }
      .bar    { fill: #313331; }
      .brand  { font-size: 16px; font-weight: 700; fill: #dcdfda; }
      .logo   { fill: #aed38f; }
      .k      { font-size: 10.5px; fill: #acb2aa; }
      .chip   { fill: #3f413f; stroke: #5e635e; stroke-width: 1; }
      .chipt  { font-size: 11.5px; fill: #dcdfda; }
      .panel  { fill: #3f413f; stroke: #4f534f; stroke-width: 1.2; }
      .pheadln{ stroke: #4f534f; stroke-width: 1; }
      .phead  { font-size: 10.5px; font-weight: 700; fill: #aed38f; letter-spacing: 2.2px; }
      .psub   { font-size: 10.5px; fill: #acb2aa; }
      .sq     { fill: #aed38f; }
      .hint   { font-size: 9.5px; font-weight: 700; fill: #acb2aa; letter-spacing: 1.6px; }
      .sel    { fill: #313331; stroke: #5e635e; stroke-width: 1; }
      .selt   { font-size: 11.5px; fill: #f7f9f6; }
      .caret  { fill: #acb2aa; }
      .btn    { fill: #aed38f; }
      .btnt   { font-size: 11.5px; font-weight: 700; fill: #161c12; letter-spacing: 1px; }
      .btno   { fill: none; stroke: #5e635e; stroke-width: 1; }
      .btnot  { font-size: 10.5px; font-weight: 600; fill: #dcdfda; letter-spacing: .8px; }
      .btnerr { fill: none; stroke: #d49898; stroke-width: 1; }
      .btnerrt{ font-size: 10.5px; font-weight: 600; fill: #d49898; letter-spacing: .8px; }
      .sum    { font-size: 10.5px; fill: #acb2aa; }
      .machine{ fill: #313331; stroke: #5e635e; stroke-width: 1; }
      .mled   { fill: #aed38f; }
      .mbar   { fill: #aed38f; }
      .iid    { font-size: 12.5px; font-weight: 600; fill: #f7f9f6; }
      .tag    { fill: none; stroke: #5e635e; stroke-width: 1; }
      .tagt   { font-size: 9px; fill: #acb2aa; letter-spacing: .8px; }
      .tagon  { fill: none; stroke: #aed38f; stroke-width: 1; }
      .tagont { font-size: 9px; fill: #aed38f; letter-spacing: .8px; }
      .meta   { font-size: 11px; fill: #acb2aa; }
      .metab  { font-size: 11px; fill: #dcdfda; }
      .sess   { font-size: 11px; fill: #dcc88b; }
      .sessmut{ font-size: 11px; fill: #848a81; }
      .you    { fill: none; stroke: #aed38f; stroke-width: 1; }
      .yout   { font-size: 9px; fill: #aed38f; letter-spacing: .8px; }
      .who    { font-size: 11.5px; fill: #acb2aa; }
      .whob   { font-size: 11.5px; font-weight: 600; fill: #dcdfda; }
      .seg    { fill: #313331; stroke: #5e635e; stroke-width: 1; }
      .segon  { fill: #aed38f; }
      .segont { font-size: 10.5px; font-weight: 700; fill: #161c12; letter-spacing: 1px; }
      .segt   { font-size: 10.5px; font-weight: 700; fill: #acb2aa; letter-spacing: 1px; }
      .code   { fill: #313331; stroke: #4f534f; stroke-width: 1; }
      .cbar   { fill: #aed38f; }
      .cl     { font-size: 11.5px; fill: #f7f9f6; }
      .cp     { font-size: 11.5px; fill: #aed38f; }
      .note   { font-size: 11px; fill: #acb2aa; }
      .status { fill: #313331; stroke: #4f534f; stroke-width: 1; }
      .st     { font-size: 11px; fill: #aed38f; }
      .ver    { font-size: 11px; fill: #acb2aa; }
    </style>
  </defs>

  <rect class="win" x="1" y="1" width="1098" height="638" rx="10"/>

  <!-- header bar -->
  <path class="bar" d="M1 11 a10 10 0 0 1 10 -10 h1078 a10 10 0 0 1 10 10 v33 h-1098 z"/>
  <text x="26" y="29" class="brand"><tspan class="logo">⬢ </tspan>ztna</text>
  <text x="110" y="29" class="k">ENDPOINT</text>
  <rect class="chip" x="178" y="14" width="212" height="22" rx="4"/>
  <text x="188" y="29" class="chipt">abc123.lambda-url.us-east-2…</text>
  <text x="412" y="29" class="k">OPERATOR</text>
  <rect class="chip" x="482" y="14" width="56" height="22" rx="4"/>
  <text x="494" y="29" class="chipt">frank</text>
  <rect class="btno" x="1002" y="14" width="74" height="22" rx="4"/>
  <text x="1014" y="29" class="btnot">Sign out</text>

  <!-- LAUNCH panel -->
  <rect class="panel" x="22" y="58" width="1056" height="248" rx="5"/>
  <rect class="sq" x="38" y="73" width="7" height="7"/>
  <text x="54" y="81" class="phead">LAUNCH</text>
  <text x="620" y="81" class="psub">place the EC2 jump · VPCs and subnets discovered live</text>
  <line class="pheadln" x1="22" y1="92" x2="1078" y2="92"/>

  <text x="38" y="114" class="hint">VPC</text>
  <rect class="sel" x="38" y="122" width="268" height="28" rx="3"/>
  <text x="48" y="140" class="selt">vpc-01100e49 · 172.31.0.0/16 · default</text>
  <path class="caret" d="M292 133 l5 7 5 -7 z"/>

  <text x="322" y="114" class="hint">SUBNET</text>
  <rect class="sel" x="322" y="122" width="330" height="28" rx="3"/>
  <text x="332" y="140" class="selt">subnet-0d5b18fc · us-east-2a · 172.31.0.0/20 · public</text>
  <path class="caret" d="M638 133 l5 7 5 -7 z"/>

  <text x="668" y="114" class="hint">LEASE</text>
  <rect class="sel" x="668" y="122" width="70" height="28" rx="3"/>
  <text x="678" y="140" class="selt">4 h</text>
  <path class="caret" d="M724 133 l5 7 5 -7 z"/>

  <rect class="btn" x="754" y="122" width="134" height="28" rx="3"/>
  <text x="766" y="140" class="btnt">⏻ LAUNCH JUMP</text>
  <text x="906" y="140" class="sum">1 / 3 up · idle 30 min → terminated</text>

  <!-- machine card -->
  <rect class="machine" x="38" y="166" width="1024" height="122" rx="3"/>
  <rect class="mbar" x="38" y="166" width="3" height="122"/>
  <circle class="mled" cx="62" cy="192" r="5"/>
  <text x="80" y="197" class="iid">i-0b6b1d2c5cf4231fb</text>
  <rect class="tagon" x="256" y="182" width="64" height="18" rx="2"/>
  <text x="266" y="194.5" class="tagont">RUNNING</text>
  <rect class="tag" x="328" y="182" width="72" height="18" rx="2"/>
  <text x="338" y="194.5" class="tagt">EC2 JUMP</text>
  <rect class="btno" x="884" y="180" width="50" height="22" rx="3"/>
  <text x="896" y="195" class="btnot">+1 h</text>
  <rect class="btnerr" x="944" y="180" width="86" height="22" rx="3"/>
  <text x="956" y="195" class="btnerrt">Terminate</text>
  <text x="80" y="226" class="meta">subnet-0d5b18fc · by frank · <tspan class="metab">3h 12m left</tspan></text>
  <line class="pheadln" x1="652" y1="212" x2="652" y2="280"/>
  <text x="1030" y="230" text-anchor="end" class="sess">frank · map db-a.abc….rds.amazonaws.com:3306 · 24 min <tspan class="yout">[YOU]</tspan></text>
  <text x="1030" y="252" text-anchor="end" class="sess">frank · socks all · 1h 02m <tspan class="yout">[YOU]</tspan></text>
  <text x="1030" y="274" text-anchor="end" class="sessmut">ci-probe · 3 min</text>

  <!-- CONNECT panel -->
  <rect class="panel" x="22" y="322" width="1056" height="252" rx="5"/>
  <rect class="sq" x="38" y="337" width="7" height="7"/>
  <text x="54" y="345" class="phead">CONNECT</text>
  <text x="586" y="345" class="psub">through SSM · no inbound · the command runs on your machine</text>
  <line class="pheadln" x1="22" y1="356" x2="1078" y2="356"/>

  <text x="38" y="378" class="who">Connect · <tspan class="whob">i-0b6b1d2c5cf4231fb</tspan> · subnet-0d5b18fc</text>

  <rect class="seg" x="38" y="392" width="258" height="28" rx="3"/>
  <rect class="segon" x="39" y="393" width="128" height="26" rx="2"/>
  <text x="54" y="410.5" class="segont">PORT FORWARD</text>
  <text x="182" y="410.5" class="segt">SOCKS PROXY</text>

  <text x="318" y="386" class="hint">TARGET</text>
  <rect class="sel" x="318" y="392" width="332" height="28" rx="3"/>
  <text x="328" y="410" class="selt">db-a.abc123.us-east-2.rds.amazonaws.com:3306</text>
  <path class="caret" d="M636 403 l5 7 5 -7 z"/>

  <text x="672" y="386" class="hint">LOCAL PORT</text>
  <rect class="sel" x="672" y="392" width="66" height="28" rx="3"/>
  <text x="682" y="410" class="selt">3306</text>

  <text x="760" y="386" class="hint">AWS PROFILE</text>
  <rect class="sel" x="760" y="392" width="84" height="28" rx="3"/>
  <text x="770" y="410" class="selt">dev</text>

  <!-- command -->
  <rect class="code" x="38" y="434" width="1024" height="78" rx="3"/>
  <rect class="cbar" x="38" y="434" width="3" height="78"/>
  <rect class="btno" x="992" y="442" width="58" height="20" rx="3"/>
  <text x="1006" y="456" class="btnot">Copy</text>
  <text x="54" y="456" class="cl">aws ssm start-session --target <tspan class="cp">i-0b6b1d2c5cf4231fb</tspan> --region us-east-2 --profile dev \</text>
  <text x="54" y="476" class="cl">  --reason <tspan class="cp">ztna:frank:map:x7k2q9:db-a.abc123.us-east-2.rds.amazonaws.com:3306</tspan> \</text>
  <text x="54" y="496" class="cl">  --document-name AWS-StartPortForwardingSessionToRemoteHost --parameters host=db-a…,portNumber=<tspan class="cp">3306</tspan>,localPortNumber=<tspan class="cp">3306</tspan></text>

  <text x="38" y="536" class="note">localhost:3306 = db-a…:3306 (through 0b6b1d2c). Forwarding a second database at the same time? Give it another local port.</text>

  <!-- status bar -->
  <rect class="status" x="22" y="586" width="1056" height="32" rx="5"/>
  <text x="38" y="606" class="st">[06:12:09] jump 0b6b1d2c starting in subnet-0d5b18fc, for 4 h</text>
  <text x="1006" y="606" class="ver">ztna 0.2.1</text>
</svg>
