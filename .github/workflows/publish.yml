name: publish
# git tag vX.Y.Z && git push --tags -> tests -> build client/ -> PyPI.
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    permissions:
      id-token: write
    uses: cloudformer/redefine-aws-serverless-workflow/.github/workflows/reusable-publish.yml@main
    with:
      install: "pytest boto3 idlefree-auth idlefree-ui"
    secrets: inherit
