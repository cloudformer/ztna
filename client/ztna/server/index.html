<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ztna</title>
<style>
/* idlefree-ui */

/* ---- ztna: charcoal console — dark (default) is the charcoal below; ☀ switches to the idlefree-ui light theme ---- */
:root { --warn: #b45309; --accent-fg: #ffffff; --inset: #f9fafb; --width: 1020px; }
:root[data-theme="dark"] {
  --bg:#353735; --panel:#3f413f; --panel2:#464846; --line:#4f534f; --line2:#5e635e;
  --text:#dcdfda; --muted:#acb2aa; --faint:#848a81;
  --accent:#aed38f; --accent-bg:#3d453a; --accent-text:#cde7b2;
  --ok:#aed38f; --err:#d49898; --err-bg:#453737; --warn:#dcc88b;
  --bar:#313331; --bar-text:#cacfc7; --bar-muted:#acb2aa;
  --code-bg:#313331; --code-text:#f7f9f6; --code-ok:#aed38f; --code-err:#d49898;
  --accent-fg:#161c12; --inset:#313331;
}
body { font-family: var(--mono); font-size: 13.5px; }
.page { max-width: calc(var(--width) + 32px); margin-inline: auto; }
.bar, .status { padding-inline: max(16px, calc((100% - var(--width)) / 2)); }
.brand .logo { color: var(--accent); }

/* panels: a head strip + body, mission-control style */
.panel { padding: 0; }
.phead { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding: 8px 16px;
  font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.phead::before { content: ""; width: 7px; height: 7px; background: var(--accent); flex: none; }
.phead .sub { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: auto; font-size: 11.5px; }
.pbody { padding: 13px 16px 15px; }

.field { display: inline-flex; flex-direction: column; gap: 4px; min-width: 0; }
.field .hint { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.field select, .field input { padding: 7px 10px; background: var(--inset); border-color: var(--line2); font-size: 13px; }
.start-row, .ctl { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.start-row .spacer { flex: 1; }
.start-row .sum { color: var(--muted); font-size: 11.5px; align-self: center; }
.btn-primary { letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }

/* jump machines */
.rows { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.rows:empty { display: none; }
.machine { display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; gap: 3px 14px; align-items: center;
  border: 1px solid var(--line2); border-left: 3px solid var(--ok); border-radius: 4px;
  background: var(--inset); padding: 11px 14px; cursor: pointer; }
.machine:hover { background: var(--panel2); }
.machine.picked { border-color: var(--accent); }
.machine.down { border-left-color: var(--faint); }
.machine .led { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); grid-row: span 2; align-self: start; margin-top: 4px; }
.machine.down .led { background: var(--faint); }
.machine .top { min-width: 0; }
.machine .iid { font-weight: 600; color: var(--code-text); font-size: 13.5px; }
.machine .tag { border: 1px solid var(--line2); color: var(--muted); border-radius: 2px; padding: 0 6px;
  margin-left: 8px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.machine .tag.on { color: var(--ok); border-color: var(--ok); }
.machine .meta { color: var(--muted); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.machine .meta b { color: var(--text); font-weight: 500; }
.machine .meta .soon { color: var(--err); font-weight: 600; }
.machine .sess { grid-row: span 2; display: flex; flex-direction: column; gap: 2px; align-items: flex-end;
  justify-content: center; border-left: 1px solid var(--line); padding-left: 14px; align-self: stretch;
  color: var(--warn); font-size: 12px; max-width: 420px; }
.machine .sess > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.machine .sess .mut { color: var(--faint); }
.machine .sess .you { color: var(--accent); border: 1px solid var(--accent); border-radius: 2px;
  padding: 0 5px; font-size: 10px; letter-spacing: .08em; margin-left: 6px; }
.machine .act { grid-row: span 2; display: flex; gap: 7px; align-self: start; }
@media (max-width: 760px) { .machine { grid-template-columns: auto minmax(0,1fr) auto; }
  .machine .sess { grid-row: auto; grid-column: 1 / -1; border-left: none; padding-left: 0; align-items: flex-start; } }
.empty-row { padding: 10px 2px; color: var(--muted); font-size: 12.5px; }

/* connect */
.connect-grid { display: grid; gap: 10px; }
.who { color: var(--muted); font-size: 12.5px; }
.who b { color: var(--text); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; }
.seg button { border: none; background: var(--inset); padding: 7px 16px; font: 700 11.5px var(--mono);
  letter-spacing: .12em; text-transform: uppercase; color: var(--muted); cursor: pointer; border-right: 1px solid var(--line2); }
.seg button:last-child { border-right: none; }
.seg button.on { background: var(--accent); color: var(--accent-fg); }
.ctl select:disabled { color: var(--faint); border-style: dashed; }
.ctl input { font: 12px var(--mono); }
.ctl #custom { min-width: 170px; }
.cmd { position: relative; }
.cmd pre { margin: 0; padding: 11px 12px; border-radius: 4px; background: var(--code-bg);
  border: 1px solid var(--line); border-left: 3px solid var(--accent); color: var(--code-text);
  font: 12px/1.7 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.cmd .copy { position: absolute; top: 8px; right: 8px; }
.note { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header class="bar">
  <span class="brand"><span class="logo">⬢</span>ztna</span>
  <span class="meta"><span class="k">Endpoint</span><span class="chip" id="info-host">-</span></span>
  <span class="meta" id="who-meta" hidden><span class="k">Operator</span><span class="chip" id="who">-</span></span>
  <span class="spacer"></span>
  <button class="tb" id="theme" title="Switch between the charcoal and light themes">☀ Light</button>
  <button class="tb" id="logout">Sign out</button>
</header>

<div class="page">
  <section class="panel">
    <div class="phead">Launch<span class="sub">place the EC2 jump · VPCs and subnets discovered live</span></div>
    <div class="pbody">
      <div class="start-row">
        <label class="field"><span class="hint">VPC</span><select id="vpc"></select></label>
        <label class="field"><span class="hint">Subnet</span><select id="subnet"></select></label>
        <label class="field"><span class="hint">Lease</span><select id="duration"></select></label>
        <button class="btn btn-primary" id="power-on">⏻ Launch jump</button>
        <span class="spacer"></span>
        <span class="sum" id="jumps-sum"></span>
      </div>
      <div class="rows" id="jumps"></div>
    </div>
  </section>

  <section class="panel">
    <div class="phead">Connect<span class="sub">through SSM · no inbound · the command runs on your machine</span></div>
    <div class="pbody connect-grid">
      <div class="who" id="who-jump">Launch a jump, then pick it to connect.</div>
      <div class="ctl">
        <div class="seg" id="mode" role="radiogroup" aria-label="Mode">
          <button data-m="map" class="on" type="button">Port forward</button>
          <button data-m="socks" type="button">SOCKS proxy</button>
        </div>
        <label class="field" id="target-field"><span class="hint">Target</span><select id="target"></select></label>
        <input id="custom" placeholder="db-host:3306" hidden>
        <label class="field" id="lport-field"><span class="hint">Local port</span><input id="lport" size="5" inputmode="numeric"></label>
        <label class="field"><span class="hint">AWS profile</span><input id="profile" placeholder="default" size="8"></label>
      </div>
      <div class="cmd"><button class="btn btn-small copy" id="copy">Copy</button><pre id="cmd"># launch a jump first</pre></div>
      <div class="note" id="hint"></div>
    </div>
  </section>
</div>

<div class="history" id="history" hidden></div>
<footer class="status" id="status" title="Click: this session's calls">
  <span class="last" id="last">ready</span>
  <a class="ver" href="https://github.com/cloudformer/ztna/blob/main/CHANGELOG.md" target="_blank" rel="noopener noreferrer"
     title="What changed in each release">ztna __VERSION__</a>
</footer>

<dialog id="kill-dlg">
  <form method="dialog">
    <h3>Terminate jump?</h3>
    <p class="note" id="kill-what" style="margin:0 0 4px"></p>
    <p class="note" id="kill-sess" style="margin:0 0 10px"></p>
    <div class="actions">
      <button class="btn-danger" value="ok">Terminate</button>
      <button class="btn" value="cancel" formnovalidate autofocus>Keep it</button>
    </div>
  </form>
</dialog>

<dialog id="dlg">
  <form method="dialog">
    <h3>Sign in</h3>
    <div class="form-grid">
      <div class="form-field"><label for="u">user</label><input id="u" autocomplete="username"></div>
      <div class="form-field"><label for="p">password</label><input id="p" type="password" autocomplete="current-password"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" value="ok">OK</button>
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
    </div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const h = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props || {}); e.append(...kids.filter(k => k != null)); return e; };
const store = {
  get: k => { try { return localStorage.getItem('ztna_' + k); } catch(e){ return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem('ztna_' + k) : localStorage.setItem('ztna_' + k, v); } catch(e){} },
};
let cred = store.get('cred') || '';
$('#info-host').textContent = location.host;

// charcoal by default; ☀ switches to the idlefree-ui light theme, remembered per browser
let theme = store.get('theme') || 'dark';
function applyTheme(){ document.documentElement.dataset.theme = theme;
  $('#theme').textContent = theme === 'dark' ? '☀ Light' : '☾ Dark'; }
$('#theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; store.set('theme', theme); applyTheme(); };
applyTheme();
let cfg = null, jumps = [], picked = null, mode = 'map', me = '';
const POLL_MS = 4000;

// one 6-char token per browser: every command this page generates carries it in --reason,
// so the sessions list can mark the connections that came from this machine as YOU
let tok = store.get('tok');
if (!tok){ const a = 'abcdefghijklmnopqrstuvwxyz0123456789';
  tok = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => a[b % 36]).join(''); store.set('tok', tok); }

// ---- sign-in ----
function askCred(){
  return new Promise(resolve => {
    const dlg = $('#dlg'); dlg.returnValue = 'cancel';
    dlg.onclose = () => { if (dlg.returnValue === 'ok' && $('#u').value) { cred = $('#u').value.trim() + ':' + $('#p').value; store.set('cred', cred); } $('#p').value = ''; resolve(dlg.returnValue === 'ok'); };
    dlg.showModal(); $('#u').focus();
  });
}
async function api(path, opts = {}, retried){
  const headers = {'content-type': 'application/json'};
  if (cred) headers.authorization = 'Basic ' + btoa(cred);
  const r = await fetch(path, Object.assign({}, opts, {headers}));
  let data = {}; try { data = await r.json(); } catch(e) {}
  if (r.status === 401){
    if (!data.http_auth) throw new Error('sign in through Cloudflare Access, then reload');
    cred = ''; store.set('cred', null);
    if (!retried && await askCred()) return api(path, opts, true);
    throw new Error('not signed in');
  }
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

// ---- status bar ----
const calls = []; let historyOpen = store.get('history') === '1';
function ts(){ const d = new Date(), p = n => String(n).padStart(2, '0'); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function note(text, ok){ calls.push({text: `[${ts()}] ${text}`, cls: ok ? 'ok' : 'err'}); if (calls.length > 300) calls.shift();
  const last = calls[calls.length - 1]; $('#last').textContent = last.text; $('#last').className = 'last ' + last.cls; renderHistory(); }
function renderHistory(){ const box = $('#history'); box.hidden = !historyOpen;
  if (historyOpen) box.replaceChildren(...(calls.length ? calls.slice().reverse().map(c => h('div', {className: c.cls, textContent: c.text})) : [h('div', {textContent: 'No calls yet.'})])); }
$('#status').onclick = e => { if (e.target.closest('a')) return; historyOpen = !historyOpen; store.set('history', historyOpen ? '1' : '0'); renderHistory(); };

// ---- helpers ----
function short(id){ return id.replace('i-', '').slice(0, 8); }
function hours(m){ return m % 60 ? `${m} min` : `${m / 60} h`; }
function left(until){ const s = Math.max(0, Math.round((new Date(until) - new Date()) / 1000));
  return [s >= 3600 ? `${Math.floor(s/3600)}h ${String(Math.floor(s/60)%60).padStart(2,'0')}m left` : `${Math.ceil(s/60)} min left`, s < 600]; }
function mins(t){ return Math.max(0, Math.round((Date.now() - new Date(t)) / 60000)); }

// a session line: who · mode · target · how long, YOU when its --reason carries this browser's token
function sessLine(s){
  const m = /^ztna:([^:]+):(map|socks):([a-z0-9]{6})(?::(.*))?$/.exec(s.reason || '');
  const label = m ? `${m[1]} · ${m[2]}${m[4] ? ' ' + m[4] : ''}` : (s.owner || 'unknown');
  const line = h('span', {}, `${label} · ${mins(s.started)} min`);
  if (m && m[3] === tok) line.append(h('span', {className: 'you', textContent: 'YOU'}));
  return line;
}

// ---- jumps list ----
function render(){
  const up = jumps.filter(j => j.state === 'running' || j.state === 'pending');
  $('#jumps-sum').textContent = `${up.length} / ${cfg.max_jumps} up · idle ${cfg.idle_shutdown_minutes} min → terminated`;
  $('#power-on').disabled = up.length >= cfg.max_jumps;
  $('#jumps').replaceChildren(...jumps.map(j => {
    const [rest, soon] = j.until ? left(j.until) : ['', false];
    const starting = j.state === 'pending';
    const sess = j.sessions || [];
    const sessCol = sess.length
      ? sess.map(s => sessLine(s))
      : [h('span', {className: 'mut', textContent: 'no session'})];
    const r = h('div', {className: 'machine' + (picked === j.id ? ' picked' : '') + (starting ? ' down' : '')},
      h('span', {className: 'led'}),
      h('span', {className: 'top'},
        h('span', {className: 'iid', textContent: j.id}),
        h('span', {className: 'tag on', textContent: starting ? 'starting' : j.state}),
        h('span', {className: 'tag', textContent: 'EC2 jump'})),
      h('span', {className: 'sess'}, ...sessCol),
      h('span', {className: 'act'},
        h('button', {className: 'btn btn-small', textContent: '+' + hours(cfg.extend_minutes), title: 'Keep it up longer',
          onclick: e => { e.stopPropagation(); extend(j); }}),
        h('button', {className: 'btn-danger', textContent: 'Terminate', onclick: e => { e.stopPropagation(); terminate(j); }})),
      h('span', {className: 'meta'}, `${j.network} · by ${j.by || '?'} · `,
        h('span', {className: soon ? 'soon' : '', textContent: rest || '…'})));
    r.onclick = () => { picked = j.id; loadTargets(j.vpc); fillTargets(); renderConnect(); render(); };
    return r;
  }));
  if (!jumps.length) $('#jumps').replaceChildren(h('div', {className: 'empty-row', textContent: 'No jump up. Launch one above — it lands in the subnet you picked.'}));
}

// ---- connect ----
const targetCache = {};            // vpc id -> endpoints the server discovered (RDS/ElastiCache + static extras)
async function loadTargets(vpc){
  if (!vpc || targetCache[vpc]) return;
  try { targetCache[vpc] = (await api('/api/targets?vpc=' + vpc)).targets; } catch(e){ targetCache[vpc] = []; }
  fillTargets(); renderConnect();
}
function fillTargets(){
  if (mode === 'map'){
    const j = jumps.find(x => x.id === picked);
    const list = (j && targetCache[j.vpc]) || [];
    // the option shows the host; its port lands in the Local port box (one port on screen, not two)
    $('#target').replaceChildren(...list.map(t => { const i = t.lastIndexOf(':');
      return h('option', {value: t, textContent: i > 0 ? t.slice(0, i) : t}); }),
      h('option', {value: '__c', textContent: 'custom…'}));
    $('#target').disabled = false; $('#lport-field').hidden = false;
    syncLport();
  } else {
    $('#target').replaceChildren(h('option', {textContent: 'all traffic · 0.0.0.0/0 → 127.0.0.1:1080'}));
    $('#target').disabled = true; $('#custom').hidden = true; $('#lport-field').hidden = true;
  }
}
// the local port follows the target's own port until you type your own (e.g. a second MySQL on 3307)
function syncLport(){ $('#lport').value = (tval().split(':')[1] || ''); }
function tval(){ return $('#target').value === '__c' ? $('#custom').value.trim() : $('#target').value; }
function renderConnect(){
  const j = jumps.find(x => x.id === picked);
  $('#custom').hidden = !(mode === 'map' && $('#target').value === '__c');
  if (!j){ $('#who-jump').textContent = 'Launch a jump, then pick it to connect.'; $('#cmd').textContent = '# launch a jump first'; $('#hint').textContent = ''; return; }
  $('#who-jump').innerHTML = `Connect · <b>${j.id}</b> · ${j.network}`;
  const region = (cfg.region ? ` --region ${cfg.region}` : '')
               + ($('#profile').value.trim() ? ` --profile ${$('#profile').value.trim()}` : '');
  if (mode === 'map'){
    const t = (tval() || 'host:port'), [host, port] = t.split(':');
    const lport = $('#lport').value.trim() || port;
    const reason = ` --reason ztna:${me || 'unknown'}:map:${tok}:${t || 'host:port'}`;
    $('#cmd').textContent =
`aws ssm start-session --target ${j.id}${region}${reason} \\
  --document-name AWS-StartPortForwardingSessionToRemoteHost \\
  --parameters host=${host || 'host'},portNumber=${port || 'PORT'},localPortNumber=${lport || 'PORT'}`;
    $('#hint').textContent = `localhost:${lport || 'PORT'} = ${host || 'host'}:${port || 'PORT'} (through ${short(j.id)}). Forwarding a second database at the same time? Give it another local port.`;
  } else {
    const reason = ` --reason ztna:${me || 'unknown'}:socks:${tok}:all`;
    $('#cmd').textContent =
`aws ec2-instance-connect send-ssh-public-key --instance-id ${j.id}${region} \\
  --instance-os-user ${cfg.ssh_user} --ssh-public-key file://$HOME/.ssh/id_ed25519.pub && \\
ssh -N -D 1080 \\
  -o ProxyCommand="aws ssm start-session --target ${j.id}${region}${reason} --document-name AWS-StartSSHSession --parameters portNumber=22" \\
  ${cfg.ssh_user}@${j.id}`;
    $('#hint').textContent = `All traffic: SOCKS5 on 127.0.0.1:1080 — point your browser/apps there. The first command authorizes your key for 60 s (nothing long-lived stays on the jump); reconnecting = run the whole line again.`;
  }
}
$('#mode').querySelectorAll('button').forEach(b => b.onclick = () => { mode = b.dataset.m;
  $('#mode').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); fillTargets(); renderConnect(); });
$('#target').onchange = () => { syncLport(); renderConnect(); };
$('#custom').oninput = () => { syncLport(); renderConnect(); };
$('#lport').oninput = renderConnect;
$('#profile').value = store.get('profile') || '';
$('#profile').oninput = () => { store.set('profile', $('#profile').value.trim() || null); renderConnect(); };
$('#copy').onclick = () => { navigator.clipboard?.writeText($('#cmd').textContent).then(() => note('command copied', true)).catch(() => {}); };

// ---- actions ----
$('#power-on').onclick = async () => {
  $('#power-on').disabled = true;
  try { const j = await api('/api/jumps', {method: 'POST', body: JSON.stringify({subnet: $('#subnet').value, minutes: +$('#duration').value})});
    note(`jump ${short(j.id)} starting in ${j.network}, for ${hours(+$('#duration').value)}`, true);
    jumps.unshift(j); picked = j.id; render(); renderConnect();
  } catch(e) { note(e.message, false); render(); }
};
async function extend(j){ try { const d = await api(`/api/jumps/${j.id}/extend`, {method: 'POST'}); j.until = d.until; render();
  note(`jump ${short(j.id)} kept until ${new Date(d.until).toLocaleTimeString()}`, true); } catch(e) { note(e.message, false); } }
function terminate(j){
  const n = (j.sessions || []).length;
  $('#kill-what').textContent = `${j.id} · ${j.network} — the instance is destroyed, nothing is kept.`;
  $('#kill-sess').textContent = n ? `⚠ ${n} active SSM session${n > 1 ? 's' : ''} will drop.` : 'No active SSM session.';
  const dlg = $('#kill-dlg'); dlg.returnValue = 'cancel';
  dlg.onclose = async () => {
    if (dlg.returnValue !== 'ok') return;
    try { await api(`/api/jumps/${j.id}/stop`, {method: 'POST'}); note(`jump ${short(j.id)} terminating`, true); }
    catch(e) { note(e.message, false); }
  };
  dlg.showModal();
}
$('#logout').onclick = () => { cred = ''; store.set('cred', null); note('signed out', true); };

// ---- poll ----
async function poll(){
  try { jumps = (await api('/api/jumps')).jumps;
    if (picked && !jumps.some(j => j.id === picked)) { picked = null; renderConnect(); }
    render();
  } catch(e) { note(e.message, false); }
  setTimeout(poll, POLL_MS);
}

let vpcs = [];
function fillSubnets(){
  const v = vpcs.find(x => x.id === $('#vpc').value);
  $('#subnet').replaceChildren(...(v ? v.subnets : []).map(sn => h('option', {value: sn.id,
    textContent: `${sn.name || sn.id} · ${sn.az} · ${sn.cidr}${sn.public ? ' · public' : ''}`})));
}
$('#vpc').onchange = fillSubnets;

async function start(){
  cfg = await api('/api/config');
  api('/api/networks').then(r => { vpcs = r.vpcs;
    $('#vpc').replaceChildren(...vpcs.map(v => h('option', {value: v.id,
      textContent: `${v.name || v.id} · ${v.cidr}${v.default ? ' · default' : ''}`})));
    fillSubnets();
  }).catch(e => note(e.message, false));
  $('#duration').replaceChildren(...cfg.durations.map(m => h('option', {value: m, textContent: hours(m)})));
  $('#duration').value = cfg.default_minutes;
  fillTargets(); renderConnect();
  const d = await api('/api/me'); me = d.identity; $('#who').textContent = me; $('#who-meta').hidden = false;
  renderConnect();
  poll();
}
renderHistory();
start().catch(e => note(e.message, false));
</script>
</body>
</html>
